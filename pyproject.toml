[project]
name = "pleiades-wayfinder"
version = "0.1.0"
description = "Interact with itiner-e API to find proximal places"
readme = "README.md"
authors = [
    { name = "Tom Elliott", email = "tom.elliott@nyu.edu" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
pleiades-wayfinder = "pleiades_wayfinder:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
